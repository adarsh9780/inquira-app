hero:
  badge: Editable Local AI
  title: AI Data Analysis
  highlight: You Can Inspect
  description: Ask a question, get Python you can read, edit, and rerun. Inquira executes the workflow locally against your DuckDB workspace and keeps project data on your machine by default.
  ctas:
    - label: Download Free
      href: "#download"
    - label: Read Docs
      href: "/docs"
  stats:
    - value: Editable
      label: Python Workflows
    - value: DuckDB
      label: Local Workspace Engine
    - value: BYOK
      label: Model Control

features:
  eyebrow: Core Features
  title: From Prompt to Python You Can Trust
  description: Move from plain-English questions to reviewable Python, charts, tables, logs, and saved artifacts in one local workspace.
  productDemos:
    - id: ask-answer
      eyebrow: Analyze
      title: Ask a question, get a workflow
      summary: Ask in plain English, watch Inquira generate and execute Python locally, then inspect the answer, chart, table, output logs, and saved artifacts.
      icon: message
      demoType: ask-answer
      media:
        video:
          src: ""
          poster: "/media/landing/ask-answer-chart.webp"
          alt: Inquira ask and answer product demo video
        image:
          src: "/media/landing/ask-answer-chart.webp"
          alt: Inquira showing an answer with a generated chart
    - id: create-workspace
      eyebrow: Organize
      title: Create a local workspace
      summary: Start a focused project, add local datasets, and keep schemas, chats, generated code, artifacts, and runtime context together.
      icon: workspace
      demoType: create-workspace
      media:
        video:
          src: ""
          poster: "/media/landing/create-workspace.webp"
          alt: Inquira workspace creation product demo video
        image:
          src: "/media/landing/create-workspace.webp"
          alt: Inquira workspace settings with local datasets
    - id: add-api-key
      eyebrow: Connect
      title: Use the model you trust
      summary: Choose OpenRouter, direct providers, or local Ollama setups. Save keys locally and decide what context you send to the model.
      icon: key
      demoType: add-api-key
      media:
        video:
          src: ""
          poster: "/media/landing/add-api-key.webp"
          alt: Inquira API key settings product demo video
        image:
          src: "/media/landing/add-api-key.webp"
          alt: Inquira LLM and API key settings
  secondaryFeatures:
    - id: local-python-execution
      title: Local Python Execution
      summary: Generated and edited scripts run in a workspace-scoped Jupyter runtime on your machine. Execution uses your user permissions and is not sandboxed.
      icon: code
      media:
        video:
          src: ""
          poster: "/media/landing/code-table.webp"
          alt: Inquira local Python execution demo video
        image:
          src: "/media/landing/code-table.webp"
          alt: Inquira code editor and generated table
    - id: local-data-handling
      title: Seamless Local Data Handling
      summary: Import CSV, Excel, JSON, and Parquet files into fast local DuckDB tables. Workspace schemas feed prompts, autocomplete, and repeatable analysis.
      icon: database
      media:
        video:
          src: ""
          poster: "/media/landing/create-workspace.webp"
          alt: Inquira local data handling demo video
        image:
          src: "/media/landing/create-workspace.webp"
          alt: Inquira workspace with linked local datasets
    - id: integrated-code-editor
      title: Integrated Code Editor
      summary: Compare agent code with your edits, use data-aware autocomplete, rerun scripts, sync table names, undo or redo changes, and export .py files.
      icon: editor
      media:
        video:
          src: ""
          poster: "/media/landing/code-table.webp"
          alt: Inquira integrated code editor demo video
        image:
          src: "/media/landing/code-table.webp"
          alt: Inquira code editor with analysis output table
    - id: resume-persistence
      title: Persistent Analysis Projects
      summary: Workspaces save datasets, conversations, editor state, turn artifacts, tables, charts, and results so you can continue without rebuilding context.
      icon: clock
      media:
        video:
          src: ""
          poster: "/media/landing/ask-answer-table.webp"
          alt: Inquira resume and persistence demo video
        image:
          src: "/media/landing/ask-answer-table.webp"
          alt: Inquira resumed conversation with table output
    - id: power-user-controls
      title: Power-User Controls
      summary: Use the built-in workspace terminal for package installs, file checks, and debugging when you need more control than chat.
      icon: terminal
      media:
        video:
          src: ""
          poster: "/media/landing/terminal-output.webp"
          alt: Inquira power-user controls demo video
        image:
          src: "/media/landing/terminal-output.webp"
          alt: Inquira terminal output inside the desktop app

howItWorks:
  eyebrow: How It Works
  title: Four Steps to Reproducible Local Analysis
  description: Connect a model, create a local DuckDB workspace, then work through an inspectable Python loop.
  steps:
    - number: 1
      title: Create a Workspace
      description: Start with a fresh workspace for your project so your files, chats, and analysis stay organized together.
      shadowColor: blue
    - number: 2
      title: Add an API Key
      description: Connect the model provider you want to use by adding your API key, or point Inquira at your local setup.
      shadowColor: orange
    - number: 3
      title: Add Datasets
      description: Import CSV, Excel, JSON, or Parquet files and let Inquira prepare them inside a fast local DuckDB workspace.
      shadowColor: orange
    - number: 4
      title: Ask, Edit, and Run
      description: Ask in plain English, inspect the generated Python, change it when needed, and rerun locally until the result is right.
      shadowColor: orange

pricing:
  eyebrow: Pricing
  title: Three Editions, One Mission
  description: From individual users to enterprise teams, there's an Inquira edition for everyone.
  popularLabel: Most Popular
  plans:
    - name: Free
      description: Core desktop experience for individuals.
      features:
        - No forced login for basic usage
        - Multiple local workspaces
        - Local DuckDB engine
        - Editable AI-generated Python
        - Tables, charts, logs, and artifacts
      cta:
        label: Download Free
        href: "#download"
      popular: false
    - name: Pro
      description: Advanced workflows for power users.
      features:
        - Everything in Free
        - RAG support
        - Multiple workspaces
        - Priority support
        - Advanced visualization themes
      cta:
        label: Get Pro
        href: "#download"
      popular: true
    - name: Enterprise
      description: Pro plus organizational integration.
      features:
        - Everything in Pro
        - Data connectors
        - MCP support
        - Team collaboration
        - Custom integrations
      cta:
        label: Contact Sales
        href: "mailto:enterprise@inquiraai.com"
      popular: false

download:
  title: Download Inquira Today
  description: Available for macOS and Windows. Your data stays on your machine.
  email:
    label: Email for product updates
    optionalLabel: (optional)
    placeholder: you@company.com
    helper: Enter your email to receive product updates. Download will proceed regardless.
  mac:
    title: Download for macOS
    description: Opens the guided installer instructions with the shell command.
  windows:
    title: Download for Windows
    description: Direct installer download.
  note: macOS uses a guided shell installer for now because the app is not yet signed and notarized.
  sourceLink:
    label: View source on GitHub
    href: "https://github.com/adarsh9780/inquira-ce"
  distributionLink:
    label: Read how desktop distribution works
    href: "/docs/getting-started/distribution"
  dialog:
    eyebrow: macOS Install
    stepsTitle: What the script does
    steps:
      - Installs Homebrew if your Mac does not already have it.
      - Installs Inquira through Homebrew and, if you approve, gives macOS the manual permission it needs to run the app without Apple's paid developer ID.
      - Leaves future upgrades to Homebrew with `brew upgrade --cask inquira`.
    commandTitle: Run this command in Terminal
    futurePlanTitle: Future notarization plan
    futurePlanBody: We plan to move to proper signed and notarized macOS distribution once the project has sustainable support to cover Apple's developer program costs responsibly. Until then, we are keeping the source public and the install flow explicit.
    futurePlanLink:
      label: Read why Apple's gatekeeping makes this harder for independent developers
      href: "/docs/getting-started/distribution#why-apple-gatekeeping-makes-this-harder"
    fullNoteLink:
      label: Read the full distribution note
      href: "/docs/getting-started/distribution"
    copyButtonLabel: Copy install command
    copiedButtonLabel: Copied install command
